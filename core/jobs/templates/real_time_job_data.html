<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Data Stream</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
      body {
        background-color: #f4f6f9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        border: none;
        border-radius: 0.85rem;
      }
      .table {
        font-size: 0.875rem;
      }
      .table > :not(caption) > * > * {
        padding: 0.65rem 0.75rem;
      }
      
      /* Cell Truncation Utility Classes */
      .truncate-text {
        max-width: 130px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
        vertical-align: middle;
      }
      .truncate-sm { max-width: 90px; }
      .truncate-lg { max-width: 180px; }

      .status-indicator {
        width: 8px;
        height: 8px;
        display: inline-block;
        border-radius: 50%;
      }
      .metric-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>

    <div class="container-fluid px-4 py-4">
      <!-- Header Section -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1">Live Employee Directory</h3>
          <p class="text-muted small mb-0">Real-time dynamic data feed</p>
        </div>
        <div>
          <!-- Live Connection Badge -->
          <span id="socket-status" class="badge bg-secondary-subtle text-secondary border px-3 py-2 rounded-pill small">
            <span class="status-indicator bg-secondary me-2"></span>Connecting...
          </span>
        </div>
      </div>

      <!-- Metric Cards (Total vs Inserted) -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="card shadow-sm p-3">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <span class="text-muted small fw-semibold text-uppercase tracking-wide">Total Records</span>
                <h2 id="total-count" class="fw-bold mb-0 mt-1">0</h2>
              </div>
              <div class="metric-icon bg-primary-subtle text-primary">
                <i class="bi bi-file-earmark-text"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card shadow-sm p-3">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <span class="text-muted small fw-semibold text-uppercase tracking-wide">Inserted Records</span>
                <h2 id="inserted-count" class="fw-bold mb-0 mt-1 text-success">0</h2>
              </div>
              <div class="metric-icon bg-success-subtle text-success">
                <i class="bi bi-check-circle"></i>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Progress Bar Card -->
      <div class="card shadow-sm mb-4 p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-semibold small text-secondary">Ingestion Progress</span>
          <span id="progress-percentage" class="fw-bold small text-primary">0%</span>
        </div>
        <div class="progress" style="height: 10px;">
          <div id="job-progress-bar" 
               class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
               role="progressbar" 
               style="width: 0%;" 
               aria-valuenow="0" 
               aria-valuemin="0" 
               aria-valuemax="100"></div>
        </div>
      </div>

      <!-- Main Data Table Card -->
      <div class="card shadow-sm">
        <div class="card-body p-3">
          <div class="table-responsive">
            <table id="recordsTable" class="table table-hover align-middle w-100">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Email</th>
                  <th>Phone No</th>
                  <th>DOB</th>
                  <th>Address</th>
                  <th>City</th>
                  <th>State</th>
                  <th>Pincode</th>
                  <th>Company</th>
                  <th>Job Title</th>
                </tr>
              </thead>
              <tbody>
                <!-- Rows injected dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery & Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
      var totalRecords = 0;
      var insertedRecords = 0;

      // Helper function to update total/inserted counters and recalculate progress
      function updateMetrics(total, inserted) {
        if (typeof total === "number" && total >= 0) totalRecords = total;
        if (typeof inserted === "number" && inserted >= 0) insertedRecords = inserted;

        document.getElementById("total-count").innerText = totalRecords;
        document.getElementById("inserted-count").innerText = insertedRecords;

        var percentage = totalRecords > 0 ? Math.min(Math.round((insertedRecords / totalRecords) * 100), 100) : 0;
        
        var progressBar = document.getElementById("job-progress-bar");
        var progressText = document.getElementById("progress-percentage");

        progressBar.style.width = percentage + "%";
        progressBar.setAttribute("aria-valuenow", percentage);
        progressText.innerText = percentage + "%";

        // Style tweaks when complete
        if (percentage === 100 && totalRecords > 0) {
          progressBar.classList.remove("progress-bar-striped", "progress-bar-animated");
          progressBar.classList.add("bg-success");
        }
      }

      function formatTruncatedCell(text, customClass = '') {
        if (!text) return '<span class="text-muted">-</span>';
        return `<span class="truncate-text ${customClass}" data-bs-toggle="tooltip" data-bs-placement="top" title="${text}">${text}</span>`;
      }

      var job_id = "{{ job_id }}";
      var socket = new WebSocket('ws://127.0.0.1:8000/ws/job/' + job_id + '/');
      var statusBadge = document.getElementById("socket-status");

      // Initialize DataTables
      var dataTable = $('#recordsTable').DataTable({
        responsive: true,
        pageLength: 10,
        lengthMenu: [10, 25, 50, 100],
        order: [[0, 'desc']],
        columns: [
          { 
            data: 'id',
            render: function(data) { return `<span class="fw-semibold text-secondary">#${data}</span>`; }
          },
          { 
            data: 'first_name',
            render: function(data) { return formatTruncatedCell(data, 'truncate-sm fw-medium'); }
          },
          { 
            data: 'last_name',
            render: function(data) { return formatTruncatedCell(data, 'truncate-sm fw-medium'); }
          },
          { 
            data: 'email',
            render: function(data) { return formatTruncatedCell(data, 'truncate-lg text-primary'); }
          },
          { 
            data: 'phone_number',
            render: function(data) { return formatTruncatedCell(data, 'truncate-sm'); }
          },
          { 
            data: 'date_of_birth',
            render: function(data) { return `<span class="text-nowrap small text-muted">${data || '-'}</span>`; }
          },
          { 
            data: 'address',
            render: function(data) { return formatTruncatedCell(data, 'truncate-lg'); }
          },
          { 
            data: 'city',
            render: function(data) { return formatTruncatedCell(data, 'truncate-sm'); }
          },
          { 
            data: 'state',
            render: function(data) { return formatTruncatedCell(data, 'truncate-sm'); }
          },
          { 
            data: 'pincode',
            render: function(data) { return `<span class="badge bg-light text-dark border">${data || '-'}</span>`; }
          },
          { 
            data: 'company',
            render: function(data) { return formatTruncatedCell(data, 'truncate-text fw-semibold'); }
          },
          { 
            data: 'job_title',
            render: function(data) {
              return `<span class="badge bg-primary-subtle text-primary border border-primary-subtle truncate-text truncate-lg" data-bs-toggle="tooltip" title="${data}">${data}</span>`;
            }
          }
        ],
        language: {
          emptyTable: "Waiting for incoming live records...",
          zeroRecords: "No matching records found"
        },
        drawCallback: function() {
          var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
          tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
          });
        }
      });

      // WebSocket Handlers
      socket.onopen = function(e) {
        statusBadge.className = "badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill small";
        statusBadge.innerHTML = '<span class="status-indicator bg-success me-2"></span>Live Stream Connected';
      };

      socket.onclose = function(e) {
        statusBadge.className = "badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2 rounded-pill small";
        statusBadge.innerHTML = '<span class="status-indicator bg-danger me-2"></span>Disconnected';
      };

      socket.onmessage = function(e) {
        var data = JSON.parse(e.data);
        
        // Dynamic payload handler for metrics + new row additions
        if (data.payload) {
          if (data.payload.event === "new_person") {
            // New events contain one person object. Unwrap the legacy
            // one-item array as well so in-flight workers remain compatible.
            var person = Array.isArray(data.payload.person)
              ? data.payload.person[0]
              : data.payload.person;

            if (person) {
              dataTable.row.add(person).draw(false);
            }
            
            // Auto-increment inserted count on each incoming person if total is known
        
            updateMetrics(data.payload.job_status.total_records, data.payload.job_status.inserted_records);
          }
        }
      };
    </script>
  </body>
</html>
